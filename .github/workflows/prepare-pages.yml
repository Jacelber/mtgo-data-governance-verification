name: Isolated resource failure and recovery verification
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [fail-and-preserve, resume]
        required: true
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: src:.
jobs:
  prepare:
    if: inputs.mode == 'fail-and-preserve'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements.txt
      - name: Fail seventh resource and encrypt six validated results
        env:
          HANDOFF_CERT: ${{ vars.ARCHIVE_HANDOFF_CERT }}
        run: python tools/cloud_resource_probe.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-resource-probe
          path: ${{ runner.temp }}/resource-probe/*.cms
          retention-days: 7
          if-no-files-found: error
  preserve:
    needs: prepare
    runs-on: ubuntu-latest
    environment: product-archive
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: encrypted-resource-probe
          path: ${{ runner.temp }}/resource-probe
      - name: Persist to private archive and read back exact results
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
          ARCHIVE_HANDOFF_KEY: ${{ secrets.ARCHIVE_HANDOFF_KEY }}
        run: python tools/cloud_resource_probe.py preserve
  resume:
    if: inputs.mode == 'resume'
    runs-on: ubuntu-latest
    environment: product-archive
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements.txt
      - name: New run retrieves six entries and requests only seven through ten
        env:
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: python tools/cloud_resource_probe.py resume
